[package]
name = "codecrafters-shell"
version = "0.1.0"
authors = ["Codecrafters <hello@codecrafters.io>"]
edition = "2021"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.68"  # error handling
bytes = "1.3.0"  # helps manage buffers
exitcode = "1.1.2"
is_executable = "1.0.5"
os_pipe = "1.2.3"
rustyline = { version = "18.0.0", default-features = false, features = [
  "custom-bindings",
  "derive"
] }
shellwords = "1.1.0"
thiserror = "2.0.18"  # error handling
trie-rs = "0.4.2"
